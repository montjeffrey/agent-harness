[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Portable code-relations query, graph refresh, and blueprint-gate installer for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-harness-query = "harness.graph_query:main"
agent-harness-doctor = "harness.doctor:main"
agent-harness-refresh = "harness.graph_refresh:main"
agent-harness-mcp = "harness.mcp_server:main"
agent-harness-install = "harness.install_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
# Floor chosen as the last 1.x line: v1.2.0 is where FastMCP's stdio API
# (`from mcp.server.fastmcp import FastMCP`, `.tool()`, `.run(transport="stdio")`)
# became the broadly-stable, documented way to build a Python MCP server.
# Capped below 2.0.0 because the SDK's v2 release renamed FastMCP to
# MCPServer and reworked the low-level Server API -- pin here to avoid
# `harness.mcp_server`'s `from mcp.server.fastmcp import FastMCP` import
# breaking on install. Re-verify this floor/cap against the SDK's current
# release notes before merging (see PR description).
mcp = [
  "mcp>=1.2.0,<2.0.0",
]
semantic = [
  "chromadb>=0.5",
]

[tool.setuptools.packages.find]
include = ["harness*", "templates*", "hooks*"]

[tool.setuptools.package-data]
templates = ["*.md"]
"hooks.claude" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
